# Woodpecker CI for fpatch.
#
# One pipeline per pull request update and one per push to main. A push to a
# pull request branch is covered by its pull_request run, so it does not start
# a second identical pipeline.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

labels:
  backend: docker

steps:
  # The module declares go 1.22 as its floor; build and test on exactly that
  # toolchain first, so a newer-only API cannot slip in.
  floor:
    image: golang:1.22
    commands:
      - go build ./...
      - go vet ./...
      - go test ./...

  # Latest stable toolchain: formatting, vet, tests, and the race detector.
  # The tests build the binary and drive it end to end (cmd/fpatch).
  stable:
    image: golang:1.26
    commands:
      - test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - go build ./...
      - go vet ./...
      - go test ./...
      - go test -race ./...
