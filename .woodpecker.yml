# Woodpecker CI for fpatch.
#
# One pipeline per pull request update and one per push to main. A push to a
# pull request branch is covered by its pull_request run, so it does not start
# a second identical pipeline.
when:
  - event: pull_request
  - event: push
    branch: main
  - event: manual

labels:
  backend: docker

steps:
  # The module declares go 1.22 as its floor; build and test on exactly that
  # toolchain first, so a newer-only API cannot slip in.
  floor:
    image: golang:1.22
    commands:
      - go build ./...
      - go vet ./...
      - go test ./...

  # Latest stable toolchain: formatting, vet, tests, and the race detector.
  # The tests build the binary and drive it end to end (cmd/fpatch).
  stable:
    image: golang:1.26
    commands:
      - test -z "$(gofmt -l .)" || (gofmt -d . && exit 1)
      - go build ./...
      - go vet ./...
      - go test ./...
      - go test -race ./...

  # The installer and the release script: shellcheck, then the installer tests against a real dist/
  # built from this commit. A fake gh and curl serves the release from dist/: no network, nothing is published.
  shellcheck:
    image: koalaman/shellcheck-alpine:stable
    commands:
      - shellcheck install.sh scripts/release.sh scripts/test-install.sh scripts/test-release.sh
  installer:
    image: golang:1.26
    commands:
      - make dist VERSION=v0.0.0
      - bash scripts/test-install.sh dist
      - bash scripts/test-release.sh
